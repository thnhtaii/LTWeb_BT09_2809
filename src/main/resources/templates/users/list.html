<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
<h1>Quản lý Users</h1>
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>
<div class="toolbar">
<form th:action="@{/users}" method="get">
<input name="keyword" th:value="${keyword}" placeholder="Username, email, họ tên...">
<input type="hidden" name="size" th:value="${size}">
<button class="button">Tìm kiếm</button>
</form>
<a class="button" th:href="@{/users/create}">+ Thêm User</a>
</div>
<table>
<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Email</th>
<th>Họ tên</th>
<th>Role</th>
<th>Enabled</th>
<th>Products</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="u : ${users.content}">
<td th:text="${u.id}"></td>
<td th:text="${u.username}"></td>
<td th:text="${u.email}"></td>
<td th:text="${u.fullName}"></td>
<td th:text="${u.roleName}"></td>
<td th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}"></td>
<td th:text="${u.productCount}"></td>
<td class="actions">
<a th:href="@{/users/edit/{id}(id=${u.id})}">Edit</a>
<form th:id="'delete-user-form-' + ${u.id}" th:action="@{/users/delete/{id}(id=${u.id})}" method="post">
<button type="button" class="danger-link" th:data-id="${u.id}" th:data-name="${u.username}" onclick="openDeleteUserModal(this.getAttribute('data-id'), this.getAttribute('data-name'))">Delete</button>
</form>
</td>
</tr>
<tr th:if="${users.empty}">
<td colspan="8">Không có dữ liệu.</td>
</tr>
</tbody>
</table>
<div class="pagination">
<a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">«</a>
<span th:each="i : ${#numbers.sequence(0, users.totalPages > 0 ? users.totalPages - 1 : 0)}">
<a th:classappend="${i == users.number ? 'active' : ''}" th:href="@{/users(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
</span>
<a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">»</a>
</div>

<!-- Modal xác nhận xóa User trên màn hình -->
<div id="deleteUserModal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">Xác nhận xóa người dùng</div>
        <div class="modal-desc" id="modalUserMessage">Bạn có chắc chắn muốn xóa user này không?</div>
        <div class="modal-buttons">
            <button type="button" class="modal-btn modal-btn-cancel" onclick="closeDeleteUserModal()">Hủy</button>
            <button type="button" class="modal-btn modal-btn-confirm" onclick="submitDeleteUser()">Xác nhận xóa</button>
        </div>
    </div>
</div>

<script>
let currentDeleteUserId = null;
function openDeleteUserModal(id, username) {
    currentDeleteUserId = id;
    if (username) {
        document.getElementById('modalUserMessage').innerText = 'Bạn có chắc chắn muốn xóa tài khoản "' + username + '" không?';
    } else {
        document.getElementById('modalUserMessage').innerText = 'Bạn có chắc chắn muốn xóa user này không?';
    }
    document.getElementById('deleteUserModal').classList.add('show');
}
function closeDeleteUserModal() {
    document.getElementById('deleteUserModal').classList.remove('show');
    currentDeleteUserId = null;
}
function submitDeleteUser() {
    if (currentDeleteUserId) {
        document.getElementById('delete-user-form-' + currentDeleteUserId).submit();
    }
}
window.addEventListener('click', function(e) {
    const modal = document.getElementById('deleteUserModal');
    if (e.target === modal) {
        closeDeleteUserModal();
    }
});
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDeleteUserModal();
    }
});
</script>

</main>
</div>
</body>
</html>
