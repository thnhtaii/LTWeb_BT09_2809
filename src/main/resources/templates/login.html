<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng nhập</h2>

    <div class="alert error" th:if="${param.error}">
        Email hoặc mật khẩu không đúng.
    </div>
    <div class="alert success" th:if="${param.verified}">
        Xác thực thành công. Hãy đăng nhập.
    </div>
    <div class="alert success" th:if="${param.reset}">
        Đổi mật khẩu thành công.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="Ví dụ: trungnh@hcmute.edu.vn">

        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu (vd: 123456)">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn primary full" type="submit" style="margin-top: 18px;">Đăng nhập</button>
    </form>

    <div style="margin-top: 18px; text-align: center;">
        <a th:href="@{/}">Về trang chủ</a>
    </div>
</div>
</body>
</html>
