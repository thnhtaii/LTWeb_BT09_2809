<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Products')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
<h1>Quản lý Products</h1>
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>
<div class="toolbar">
<form th:action="@{/products}" method="get">
<input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
<input type="hidden" name="size" th:value="${size}">
<button class="button">Tìm kiếm</button>
</form>
<a class="button" th:href="@{/products/create}">+ Thêm Product</a>
</div>
<table>
<thead>
<tr>
<th>ID</th>
<th>Ảnh</th>
<th>Name</th>
<th>Price</th>
<th>User</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr th:each="p : ${products.content}">
<td th:text="${p.id}"></td>
<td>
    <img th:if="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}" th:src="${#strings.contains(p.imageUrl, '|') ? #strings.substringBefore(p.imageUrl, '|') : p.imageUrl}" class="thumb">
    <span th:unless="${p.imageUrl != null and !#strings.isEmpty(p.imageUrl)}">No image</span>
</td>
<td th:text="${p.name}"></td>
<td th:text="${p.price != null ? #numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT') : '0'}"></td>
<td th:text="${p.username}"></td>
<td class="actions">
<a th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a>
<form th:id="'delete-form-' + ${p.id}" th:action="@{/products/delete/{id}(id=${p.id})}" method="post">
<button type="button" class="danger-link" th:data-id="${p.id}" th:data-name="${p.name}" onclick="openDeleteModal(this.getAttribute('data-id'), this.getAttribute('data-name'))">Delete</button>
</form>
</td>
</tr>
<tr th:if="${products.empty}">
<td colspan="6">Không có dữ liệu.</td>
</tr>
</tbody>
</table>
<div class="pagination">
<a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1},size=${size},keyword=${keyword})}">«</a>
<span th:each="i : ${#numbers.sequence(0, products.totalPages > 0 ? products.totalPages - 1 : 0)}">
<a th:classappend="${i == products.number ? 'active' : ''}" th:href="@{/products(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
</span>
<a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1},size=${size},keyword=${keyword})}">»</a>
</div>

<!-- Modal xác nhận xóa trên màn hình -->
<div id="deleteModal" class="modal-backdrop">
    <div class="modal-box">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">Xác nhận xóa</div>
        <div class="modal-desc" id="modalMessage">Bạn có chắc chắn muốn xóa sản phẩm này không? Hành động này không thể hoàn tác.</div>
        <div class="modal-buttons">
            <button type="button" class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">Hủy</button>
            <button type="button" class="modal-btn modal-btn-confirm" onclick="submitDelete()">Xác nhận xóa</button>
        </div>
    </div>
</div>

<script>
let currentDeleteId = null;
function openDeleteModal(id, name) {
    currentDeleteId = id;
    if (name) {
        document.getElementById('modalMessage').innerText = 'Bạn có chắc chắn muốn xóa sản phẩm "' + name + '" không?';
    } else {
        document.getElementById('modalMessage').innerText = 'Bạn có chắc chắn muốn xóa sản phẩm này không?';
    }
    document.getElementById('deleteModal').classList.add('show');
}
function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('show');
    currentDeleteId = null;
}
function submitDelete() {
    if (currentDeleteId) {
        document.getElementById('delete-form-' + currentDeleteId).submit();
    }
}
window.addEventListener('click', function(e) {
    const modal = document.getElementById('deleteModal');
    if (e.target === modal) {
        closeDeleteModal();
    }
});
window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeDeleteModal();
    }
});
</script>

</main>
</div>
</body>
</html>
