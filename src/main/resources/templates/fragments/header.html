<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">IOTSTAR SHOP</a>
    <nav>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/products}">Products</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Users</a>
    </nav>
    <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
        <span th:text="${#authentication.principal.fullName != null ? #authentication.principal.fullName : #authentication.name}"></span>
        <span th:if="${#authentication.principal.username != null}" th:text="'(' + ${#authentication.principal.username} + ')'" style="font-size:13px; opacity:0.85;"></span>
        <span th:if="${#authentication.principal.roleName != null}" th:text="'[' + ${#authentication.principal.roleName} + ']'" style="background:rgba(255,255,255,0.2); padding:2px 7px; border-radius:4px; font-size:12px;"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-button" style="text-decoration:underline;">Logout</button>
        </form>
    </div>
    <div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </div>
</header>
</body>
</html>
