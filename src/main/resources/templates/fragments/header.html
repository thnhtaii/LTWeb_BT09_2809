<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>
    </div>

    <div class="account" sec:authorize="isAuthenticated()">
        <span>Xin chào, <b sec:authentication="name">user</b></span>

        <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 12px;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">
                Đăng xuất
            </button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}" class="link-button">
            Đăng nhập
        </a>
    </div>
</header>
</body>
</html>
