<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-page">
<div class="auth-card">
<form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
<h1>Quên mật khẩu</h1>
<div th:if="${error}" class="alert error" th:text="${error}"></div>
<div th:if="${#fields.hasGlobalErrors()}" class="alert error">
    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
</div>
<label>Email</label>
<input type="email" th:field="*{email}" placeholder="Nhập email tài khoản..." required>
<button class="button full" type="submit" style="margin-top: 15px;">Gửi OTP</button>
</form>
<p>
<a th:href="@{/login}">Quay lại Đăng nhập</a>
</p>
</div>
</div>
</body>
</html>
