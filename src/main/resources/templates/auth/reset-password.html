<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-page">
<div class="auth-card">
<form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
<h1>Đặt lại mật khẩu</h1>
<div th:if="${success}" class="alert success" th:text="${success}"></div>
<div th:if="${error}" class="alert error" th:text="${error}"></div>
<div th:if="${#fields.hasGlobalErrors()}" class="alert error">
    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
</div>
<label>Email</label>
<input type="email" th:field="*{email}" placeholder="Email của bạn..." required>
<label>Mã OTP (6 số)</label>
<input name="otp" maxlength="6" inputmode="numeric" placeholder="Nhập mã OTP..." required>
<label>Mật khẩu mới</label>
<input type="password" th:field="*{password}" placeholder="Mật khẩu mới..." minlength="6" required>
<small class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

<label>Xác nhận mật khẩu</label>
<input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới..." minlength="6" required>
<small class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>

<button class="button full" type="submit" style="margin-top: 15px;">Đổi mật khẩu</button>
</form>
<p>
<a th:href="@{/login}">Quay lại Đăng nhập</a>
</p>
</div>
</div>
</body>
</html>
