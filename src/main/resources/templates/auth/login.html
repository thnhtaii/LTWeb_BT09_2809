<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1 style="color: #1d4ed8; text-align: center; margin-top: 0;">UTEShop</h1>
    <h2 style="text-align: center;">Đăng nhập</h2>

    <div th:if="${param.error}">
        <p class="alert error">Username/email hoặc password không đúng</p>
    </div>
    <div th:if="${param.logout}">
        <p class="alert success">Bạn đã đăng xuất</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Username hoặc Email</label>
            <input type="text" id="username" name="username" placeholder="Username hoặc email" required autofocus>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn primary full mt" type="submit">Đăng nhập</button>
    </form>
</div>
</body>
</html>
