<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký')}"></head>
<body>
<div class="auth-page">
<div class="auth-card">
<h1>Đăng ký</h1>
<div th:if="${error}" class="alert error" th:text="${error}"></div>
<form th:action="@{/register}" th:object="${registerDTO}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <label>Username</label>
    <input type="text" th:field="*{username}" placeholder="Nhập username..." required>
    <small class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>

    <label>Email</label>
    <input type="email" th:field="*{email}" placeholder="Nhập email..." required>
    <small class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

    <label>Họ tên</label>
    <input type="text" th:field="*{fullName}" placeholder="Nhập họ và tên..." required>
    <small class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>

    <label>Mật khẩu (tối thiểu 6 ký tự)</label>
    <input type="password" th:field="*{password}" placeholder="Nhập mật khẩu..." minlength="6" required>
    <small class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

    <label>Xác nhận Mật khẩu</label>
    <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu..." minlength="6" required>
    <small class="error-text" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>

    <button class="button full" type="submit" style="margin-top: 15px;">Đăng ký &amp; nhận OTP</button>
</form>
<p>
    <a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a>
</p>
</div>
</div>
</body>
</html>
